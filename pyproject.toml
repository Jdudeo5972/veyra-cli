[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veyra"
version = "2026.8.1"
description = "Lightweight CLI for local ONNX causal language models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "onnxruntime-directml; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "onnxruntime; sys_platform != 'win32' or platform_machine != 'AMD64'",
  "tokenizers",
  "huggingface_hub",
  "numpy",
  "prompt_toolkit",
]

[project.urls]
Homepage = "https://github.com/Jdudeo5972/veyra-cli"
Repository = "https://github.com/Jdudeo5972/veyra-cli"
Issues = "https://github.com/Jdudeo5972/veyra-cli/issues"

[project.scripts]
veyra = "veyra.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["veyra"]
